spring:
  datasource:
    url: jdbc:h2:mem:wikiplays-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 25
wikiplays:
  jwt:
    secret: test-only-jwt-secret-not-for-production-use-0123456789
  pool:
    initial-populate: false
  community:
    warmer-enabled: false
  seed:
    dummy-users:
      enabled: false
