spring:
  application:
    name: wikiplays-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wikiplays}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      # Flyway がスキーマを管理するので、Hibernate は何もしない (起動が速くなる)。
      # 移行が安定したら validate に上げて、エンティティと DB のズレ検知を有効化する。
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    # 既存の本番 DB (Hibernate ddl-auto で作られた状態) は flyway_schema_history を持たないので、
    # 初回起動時に baseline-on-migrate=true で「V1 適用済み」とマークし V1 は実行されない。
    # 新規環境 (空 DB) では V1__init.sql から順に実行される。
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  # Google OAuth は GOOGLE_CLIENT_ID を環境変数 (or application-secrets.yml) で設定した時のみ
  # SecurityConfig が条件付きで oauth2Login を有効化する。

server:
  port: 8080

wikiplays:
  jwt:
    # 本番では必須 (未設定なら起動失敗)。local プロファイルのみ開発用の固定値にフォールバックする。
    secret: ${JWT_SECRET:}
    expiration-ms: 2592000000  # 30 日
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    price-id-1m: ${STRIPE_PRICE_ID_1M:}
    price-id-3m: ${STRIPE_PRICE_ID_3M:}
    price-id-6m: ${STRIPE_PRICE_ID_6M:}
    price-id-premium: ${STRIPE_PRICE_ID_PREMIUM:}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:no-reply@wikiplays.me}
  wikipedia:
    connect-timeout-ms: 5000
    response-timeout-ms: 15000
  seed:
    # 運営が投入する架空ユーザー (ランキング・デイリーを賑やかに見せる)。false で新規投入と日次活動を停止。
    dummy-users:
      enabled: ${WIKIPLAYS_DUMMY_USERS_ENABLED:true}
      count: 100
  cors:
    # 本番では環境変数 WIKIPLAYS_ALLOWED_ORIGINS で上書き
    # 例: "https://wikiplays.me,https://www.wikiplays.me"
    allowed-origins: ${WIKIPLAYS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,https://wikiplays.me,https://www.wikiplays.me}
