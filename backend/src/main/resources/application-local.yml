spring:
  # 任意で application-secrets.yml を読み込む (Git 管理外)
  # シークレット (Stripe 秘密鍵・SMTP 認証情報・OAuth Client Secret) はそこに書く
  config:
    import: "optional:classpath:application-secrets.yml"
  datasource:
    url: jdbc:h2:mem:wikiplays;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  mail:
    # ローカル開発時のダミー SMTP 設定。MailService 内で実際の送信は無効化される
    host: localhost
    port: 25
  jpa:
    hibernate:
      # ローカルは H2 インメモリで毎回ゼロから作るので Hibernate の自動生成で十分。
      # 本番では Flyway 管理に切り替わる (application.yml 側で validate)。
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    # ローカル H2 では Flyway を無効化 (Hibernate が ddl-auto:update で全部作る)
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.wikiplays: DEBUG

wikiplays:
  jwt:
    # ローカル開発専用。本番は環境変数 JWT_SECRET を必ず設定する。
    secret: local-dev-only-jwt-secret-not-for-production-use-0123456789
