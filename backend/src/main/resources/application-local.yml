spring:
  datasource:
    url: jdbc:h2:mem:wikiplays;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  mail:
    # ローカル開発時のダミー SMTP 設定。MailService 内で実際の送信は無効化される
    host: localhost
    port: 25
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.wikiplays: DEBUG
