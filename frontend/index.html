<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 検索エンジンへのインデックス・キャッシュを全面拒否 (運用安定後に削除予定) -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <meta name="theme-color" content="#8b5cf6" />
  <title>Wikiplays | Wikipedia 主題当てクイズ</title>
  <meta name="description" content="Wikipedia の記事から主題を当てるクイズゲーム。デイリーチャレンジ、ランキング、コミュニティジャンル対応。" />
  <meta name="keywords" content="Wikipedia, クイズ, 主題当て, 早押し, デイリーチャレンジ, Wikiplays" />
  <meta name="author" content="Wikiplays" />

  <!-- Open Graph -->
  <meta property="og:title" content="Wikiplays | Wikipedia 主題当てクイズ" />
  <meta property="og:description" content="Wikipedia の記事から主題を当てるクイズゲーム。デイリーチャレンジで全国ランキングに挑戦。" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://wikiplays.me/" />
  <meta property="og:site_name" content="Wikiplays" />
  <meta property="og:locale" content="ja_JP" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Wikiplays | Wikipedia 主題当てクイズ" />
  <meta name="twitter:description" content="Wikipedia の記事から主題を当てるクイズゲーム。" />

  <link rel="canonical" href="https://wikiplays.me/" />

  <!-- AdSense (client は環境変数で差し替える想定。VITE_ADSENSE_CLIENT が空なら無効) -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
